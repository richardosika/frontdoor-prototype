# Cornicio Partners MVP Blueprint.
# This file lives at app/render.yaml so it does not replace the static prototype
# site configured from the repository root. In the Render Dashboard, set the
# Blueprint path to app/render.yaml. rootDir is relative to the repository root.
databases:
  - name: frontdoor-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: frontdoor-mvp
    runtime: node
    region: oregon
    plan: starter
    rootDir: app
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frontdoor-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
